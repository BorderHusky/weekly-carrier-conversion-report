name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas openpyxl pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --name CarrierConversionReport weekly_carrier_conversion_report.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CarrierConversionReport_EXE
          path: dist/CarrierConversionReport.exe
